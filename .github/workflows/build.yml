name: Build 3DS CIA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3DS Tools via Pacman
        run: |
          dkp-pacman -Syu --noconfirm || true
          dkp-pacman -S --noconfirm 3dstools

      - name: Verify tools
        run: |
          makerom -version
          bannertool -version

      - name: Build 3DSX and CIA
        run: make cia

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WaveDash3DS-CIA
          path: |
            *.cia
            *.3dsx
